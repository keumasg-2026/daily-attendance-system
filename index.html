<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Attendance System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Daily Attendance System</h1>
        <p>Floor-wise Employee Attendance Report</p>
    </header>

    <main>

        <section class="attendance-card">

            <h2>Daily Attendance Report</h2>

            <form id="attendanceForm">

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="floor">Floor</label>
                    <select id="floor" required>
                        <option value="">Select Floor</option>
                        <option value="1st Floor">1st Floor</option>
                        <option value="2nd Floor">2nd Floor</option>
                        <option value="3rd Floor">3rd Floor</option>
                        <option value="4th Floor">4th Floor</option>
                        <option value="5th Floor">5th Floor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="totalEmployees">Total Employees</label>
                    <input
                        type="number"
                        id="totalEmployees"
                        min="0"
                        placeholder="Enter total employees"
                        required
                    >
                </div>

                <div class="attendance-grid">

                    <div class="form-group">
                        <label for="present">Present</label>
                        <input
                            type="number"
                            id="present"
                            min="0"
                            value="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="absent">Absent</label>
                        <input
                            type="number"
                            id="absent"
                            min="0"
                            value="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="leave">Leave</label>
                        <input
                            type="number"
                            id="leave"
                            min="0"
                            value="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="dayOff">Day Off</label>
                        <input
                            type="number"
                            id="dayOff"
                            min="0"
                            value="0"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="inspector">Inspector Name</label>
                    <input
                        type="text"
                        id="inspector"
                        placeholder="Enter inspector name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <textarea
                        id="remarks"
                        rows="3"
                        placeholder="Optional remarks"
                    ></textarea>
                </div>

                <div id="validationMessage"></div>

                <button type="submit">
                    Submit Attendance
                </button>

            </form>

        </section>


        <section class="summary-card">

            <h2>Attendance Summary</h2>

            <div class="summary-grid">

                <div class="summary-box">
                    <span>Total Employees</span>
                    <strong id="summaryTotal">0</strong>
                </div>

                <div class="summary-box">
                    <span>Present</span>
                    <strong id="summaryPresent">0</strong>
                </div>

                <div class="summary-box">
                    <span>Absent</span>
                    <strong id="summaryAbsent">0</strong>
                </div>

                <div class="summary-box">
                    <span>Leave</span>
                    <strong id="summaryLeave">0</strong>
                </div>

                <div class="summary-box">
                    <span>Day Off</span>
                    <strong id="summaryDayOff">0</strong>
                </div>

                <div class="summary-box">
                    <span>Attendance Rate</span>
                    <strong id="attendanceRate">0%</strong>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Daily Attendance Management System</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
